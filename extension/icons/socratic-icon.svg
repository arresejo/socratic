<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2350"/>
      <stop offset="1" stop-color="#0b0e24"/>
    </linearGradient>
  </defs>
  <!-- rounded app background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- left pause bar -->
  <rect x="162" y="135" width="50" height="230" rx="25" fill="#ffffff"/>
  <!-- question mark: curve + stem (reads as the second pause bar interrupted by a question) -->
  <path d="M 240 190 A 55 55 0 1 1 295 245 L 295 272"
        fill="none" stroke="#ffffff" stroke-width="50" stroke-linecap="round"/>
  <!-- question dot — the amber spark -->
  <circle cx="295" cy="338" r="27" fill="#f5b942"/>
</svg>
