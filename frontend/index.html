<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socratic — la vidéo qui vous interroge</title>
  <link rel="icon" type="image/svg+xml" href="socratic-glyph.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><img src="socratic-glyph.svg" alt="" class="logo">Socratic</h1>
    <p class="tagline">La vidéo qui vous interroge.</p>
  </header>

  <section id="setup">
    <div class="row">
      <input id="url" type="text" placeholder="URL YouTube…" autocomplete="off">
      <select id="intensity" title="Intensité">
        <option value="normal" selected>Normal (5–7 questions/h)</option>
        <option value="light">Léger (~3 questions/h)</option>
      </select>
      <button id="build">Lancer la session</button>
    </div>
    <div class="row">
      <input id="background" type="text"
             placeholder="Votre profil en une ligne (optionnel — ex. « dev python, débutant en ML »)">
    </div>
    <div id="status" class="hidden"></div>
  </section>

  <section id="stage" class="hidden">
    <h2 id="videoTitle"></h2>
    <div id="localBadge">🔒 Inférence 100 % locale — vos réponses ne quittent jamais cette machine</div>
    <div id="playerWrap">
      <div id="player"></div>
      <div id="countdown" class="hidden"></div>
      <div id="overlay" class="hidden" data-state="question">
        <div id="ovConcept"></div>
        <div id="ovQuestion"></div>
        <canvas id="waveform" width="520" height="56" class="hidden"></canvas>
        <div id="ovHeard" class="hidden"></div>
        <div id="ovResult" class="hidden">
          <div id="ovVerdict"></div>
          <ul id="ovPoints"></ul>
          <div id="ovFeedback"></div>
        </div>
        <div id="ovReexplain" class="hidden"></div>
        <div class="controls">
          <button id="micDone" class="hidden">J’ai fini de parler</button>
          <form id="typeForm">
            <input id="typeInput" type="text" placeholder="…ou répondez au clavier" autocomplete="off">
            <button type="submit">Envoyer</button>
          </form>
          <button id="replayBtn" class="hidden">↺ Revoir ce passage</button>
          <button id="continueBtn" class="hidden">Continuer ▸</button>
          <button id="skipBtn" class="ghost">Passer</button>
        </div>
        <div id="ovStatus"></div>
      </div>
    </div>
    <div id="timeline" title="">
      <div id="timelineFill"></div>
    </div>
    <div id="progress"></div>
  </section>

  <section id="recap" class="hidden">
    <h2>Récap de session</h2>
    <div id="recapScore"></div>
    <ul id="recapList"></ul>
    <div id="recapWeak"></div>
    <div id="recapLocal"></div>
  </section>

  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
